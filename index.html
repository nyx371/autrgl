<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>RIFTFORGE</title>
<link rel="icon" id="favicon" href="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><i data-icon="rift" class="brand-icon"></i>RIFT<span>FORGE</span></div>
    <div id="tagchips"></div>
    <div id="clock">0:00</div>
  </header>

  <div id="canvaswrap">
    <canvas id="rift"></canvas>
    <div id="meltwarn" class="hidden"><i data-icon="hazard"></i><span id="meltcount">4.0</span>s — VENT!</div>
  </div>

  <section id="stats">
    <div class="statline">
      <div class="energy-big"><span id="energy">0</span><i data-icon="bolt"></i></div>
      <div class="eps"><span id="eps">0</span><i data-icon="bolt"></i>/s</div>
    </div>
    <div class="bar heatbar">
      <div class="bar-fill" id="heatfill"></div>
      <div class="bar-label"><i data-icon="flame"></i> <span id="heatval">0</span> <span id="heatnet"></span></div>
    </div>
    <div class="bar chargebar">
      <div class="bar-fill" id="chargefill"></div>
      <div class="bar-label"><i data-icon="rift"></i> <span id="chargeval">0%</span> <span id="chargerate"></span></div>
    </div>
  </section>

  <section id="actions">
    <button id="jolt" class="action-btn"><i data-icon="jolt" class="a-icon"></i><small id="joltamt">+3</small></button>
    <button id="vent" class="action-btn vent"><div class="cd" id="ventcd"></div><i data-icon="steam" class="a-icon"></i><small id="ventinfo">−20</small></button>
  </section>

  <section id="shop"></section>

  <!-- overlays -->
  <div id="overlay" class="overlay">
    <div class="panel" id="intro-panel">
      <h1>RIFT<span>FORGE</span></h1>
      <p class="tagline">An automation roguelike.</p>
      <ul class="rules">
        <li><i data-icon="bolt" class="li-icon c-energy"></i>Machines auto-generate energy.</li>
        <li><i data-icon="rift" class="li-icon c-charge"></i>Injectors charge the rift. 100% wins.</li>
        <li><i data-icon="flame" class="li-icon c-heat"></i>Heat rises. Max heat = meltdown.</li>
        <li><i data-icon="cards" class="li-icon c-accent"></i>Draft cards. Stack tags.</li>
      </ul>
      <button class="big-btn" id="startbtn">ENTER THE RIFT</button>
      <p class="credits">Icons: game-icons.net · CC BY 3.0</p>
    </div>

    <div class="panel hidden" id="draft-panel">
      <h2><i data-icon="cards"></i> CHOOSE ONE</h2>
      <div id="draft-cards"></div>
    </div>

    <div class="panel hidden" id="end-panel">
      <h1 id="end-title"></h1>
      <p id="end-desc"></p>
      <div id="end-stats"></div>
      <button class="big-btn" id="restartbtn">NEW RUN</button>
    </div>
  </div>

</div>
<script src="js/icons.js"></script>
<script src="js/game.js"></script>
</body>
</html>
