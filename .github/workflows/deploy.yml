name: Deploy to GitHub Pages

# Pages is configured to serve from the main branch (Deploy from a branch →
# main / root). Publishing = pushing the current commit to main; GitHub's
# pages-build-deployment then goes live automatically.
on:
  push:
    branches:
      - claude/mobile-web-game-prototype-pfhi7c
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to main branch
        run: git push --force origin HEAD:refs/heads/main
